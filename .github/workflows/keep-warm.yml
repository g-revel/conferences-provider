name: Keep backend warm

on:
  schedule:
    # Toutes les 10 min : le plan gratuit Render met le service en veille après
    # ~15 min sans trafic (cold start de 30-50s sur la requête suivante) — un ping
    # régulier maintient le backend éveillé en continu.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf https://conferences-provider-backend.onrender.com/health
